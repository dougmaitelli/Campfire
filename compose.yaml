services:
  campfire:
    image: ghcr.io/dougmaitelli/campfire:${CAMPFIRE_VERSION:-latest}
    restart: unless-stopped
    environment:
      CAMPFIRE_PUBLIC_URL: ${CAMPFIRE_PUBLIC_URL:?Set CAMPFIRE_PUBLIC_URL to your browser HTTPS origin}
    ports:
      - "127.0.0.1:${CAMPFIRE_HTTP_PORT:-8080}:8080"
      - "${CAMPFIRE_AGENT_BIND:-0.0.0.0}:${CAMPFIRE_AGENT_PORT:-8443}:8443"
    volumes:
      - campfire-data:/var/lib/campfire
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s

volumes:
  campfire-data:
