services:
  campfire:
    image: ghcr.io/dougmaitelli/campfire:${CAMPFIRE_VERSION:-latest}
    restart: unless-stopped
    environment:
      CAMPFIRE_DATABASE: ${CAMPFIRE_DATABASE:-/var/lib/campfire/panel.db}
      CAMPFIRE_DATA: /var/lib/campfire
      CAMPFIRE_LISTEN: 0.0.0.0:8080
      CAMPFIRE_SFTP_LISTEN: ${CAMPFIRE_SFTP_LISTEN:-}
      CAMPFIRE_MAX_UPLOAD_MIB: ${CAMPFIRE_MAX_UPLOAD_MIB:-1024}
      CAMPFIRE_PUBLIC_URL: ${CAMPFIRE_PUBLIC_URL:?Set CAMPFIRE_PUBLIC_URL to your browser HTTPS origin}
      CAMPFIRE_OIDC_ISSUER: ${CAMPFIRE_OIDC_ISSUER:-}
      CAMPFIRE_OIDC_CLIENT_ID: ${CAMPFIRE_OIDC_CLIENT_ID:-}
      CAMPFIRE_OIDC_CLIENT_SECRET: ${CAMPFIRE_OIDC_CLIENT_SECRET:-}
      CAMPFIRE_DISABLE_LOCAL_LOGIN: ${CAMPFIRE_DISABLE_LOCAL_LOGIN:-false}
      CAMPFIRE_AUDIT_RETENTION_DAYS: ${CAMPFIRE_AUDIT_RETENTION_DAYS:-0}
      CAMPFIRE_OPERATION_RETENTION_DAYS: ${CAMPFIRE_OPERATION_RETENTION_DAYS:-0}
      CAMPFIRE_RESOURCE_INTERVAL_SECONDS: ${CAMPFIRE_RESOURCE_INTERVAL_SECONDS:-10}
      CAMPFIRE_ALERT_CPU_PERCENT: ${CAMPFIRE_ALERT_CPU_PERCENT:-90}
      CAMPFIRE_ALERT_MEMORY_PERCENT: ${CAMPFIRE_ALERT_MEMORY_PERCENT:-90}
      CAMPFIRE_ALERT_DISK_PERCENT: ${CAMPFIRE_ALERT_DISK_PERCENT:-90}
      CAMPFIRE_ALERT_DURATION_SECONDS: ${CAMPFIRE_ALERT_DURATION_SECONDS:-120}
      CAMPFIRE_ALERT_HEALTH_ENABLED: ${CAMPFIRE_ALERT_HEALTH_ENABLED:-true}
      CAMPFIRE_APPRISE_URL: ${CAMPFIRE_APPRISE_URL:-}
      CAMPFIRE_APPRISE_TAGS: ${CAMPFIRE_APPRISE_TAGS:-}
      CAMPFIRE_APPRISE_URLS: ${CAMPFIRE_APPRISE_URLS:-}
      CAMPFIRE_AGENT_LISTEN: 0.0.0.0:8443
      CAMPFIRE_AGENT_PUBLIC_URL: ${CAMPFIRE_AGENT_PUBLIC_URL:-}
    ports:
      - "127.0.0.1:${CAMPFIRE_HTTP_PORT:-8080}:8080"
      - "${CAMPFIRE_AGENT_BIND:-0.0.0.0}:${CAMPFIRE_AGENT_PORT:-8443}:8443"
    volumes:
      - campfire-data:/var/lib/campfire
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s

volumes:
  campfire-data:
