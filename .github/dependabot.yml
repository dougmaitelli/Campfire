version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /
      - /e2e
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - vite
          - "@vitejs/plugin-react"
      lint:
        patterns:
          - eslint
          - "@eslint/*"
          - "eslint-plugin-*"
          - typescript-eslint

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
      lint:
        patterns:
          - eslint
          - "@eslint/*"
          - "eslint-plugin-*"
          - typescript-eslint
      prettier:
        patterns:
          - prettier
          - prettier-plugin-astro

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      playwright:
        patterns:
          - "@playwright/*"
          - playwright
          - playwright-core

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
