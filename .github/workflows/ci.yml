name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true' }}
      browser: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true' || steps.filter.outputs.browser == 'true' }}
      docs: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true' }}
      publish: ${{ github.ref_type == 'tag' || steps.filter.outputs.publish == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.ref_type != 'tag'
        with:
          predicate-quantifier: every
          filters: |
            app:
              - '**'
              - '!docs/**'
              - '!screenshots/**'
              - '!*.md'
              - '!LICENSE'
              - '!.github/FUNDING.yml'
              - '!.github/workflows/pages.yml'
            browser:
              - '{e2e/**,screenshots/**}'
            docs:
              - '{docs/**,screenshots/**,README.md,config/**,compose*.yaml,web/public/favicon.svg,Makefile,scripts/package-release.mjs,.github/workflows/pages.yml,.github/workflows/ci.yml}'
            publish:
              - '{backend/**,web/src/**,web/public/**,web/package.json,web/pnpm-lock.yaml,web/pnpm-workspace.yaml,web/tsconfig.json,web/vite.config.ts,Dockerfile,.dockerignore,deploy/**,config/**,compose*.yaml,.env.example,scripts/build-spark-bundles.sh,scripts/prepare-ui.mjs,scripts/package-release.mjs,.github/workflows/package.yml}'
              - '!backend/e2e/**'
              - '!backend/**/*_test.go'
              - '!backend/**/testdata/**'
              - '!backend/internal/campfire/devfixture/**'
              - '!backend/internal/campfire/devmock/**'
              - '!backend/cmd/campfire-mock/**'

  validate:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    name: Validate application
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: campfire
          POSTGRES_PASSWORD: campfire
          POSTGRES_DB: campfire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campfire -d campfire"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            e2e/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - run: make dependencies
      - run: make tools
      - run: make check
      - run: make test-postgres
        env:
          CAMPFIRE_TEST_POSTGRES: postgresql://campfire:campfire@127.0.0.1:5432/campfire?sslmode=disable

  browser-tests:
    name: Browser tests
    timeout-minutes: 20
    needs: changes
    if: >-
      needs.changes.outputs.browser == 'true' &&
      (github.event_name != 'push' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: make test-e2e-docker
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-test-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      deploy: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

  publish:
    name: Publish images and tagged releases
    needs: [changes, validate, browser-tests]
    if: >-
      always() && github.event_name == 'push' &&
      needs.changes.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (github.ref_type != 'tag' || needs.browser-tests.result == 'success') &&
      needs.changes.outputs.publish == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/package.yml

  ci-result:
    name: CI result
    if: always()
    needs: [changes, validate, browser-tests, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected checks to pass
        env:
          FAILED: ${{ needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
