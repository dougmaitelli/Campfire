name: Publish packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      image: ${{ steps.release.outputs.image }}
      build_date: ${{ steps.release.outputs.build_date }}
      latest: ${{ steps.release.outputs.latest }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine and validate release version
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ "$REF_TYPE" == branch && "$REF_NAME" == master ]]; then
            version=dev
          elif [[ "$REF_TYPE" == tag ]]; then
            version="$REF_NAME"
            semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
            [[ "$version" =~ $semver && ${#version} -le 64 ]] || { echo "Expected vMAJOR.MINOR.PATCH or a SemVer prerelease tag." >&2; exit 1; }
            if [[ "$version" == *-* ]]; then
              IFS=. read -ra identifiers <<< "${version#*-}"
              for identifier in "${identifiers[@]}"; do
                if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" == 0?* ]]; then
                  echo "Numeric prerelease identifiers cannot have leading zeroes." >&2
                  exit 1
                fi
              done
            fi
          else
            echo "Publishing requires a master push or a version tag." >&2
            exit 1
          fi
          latest=false
          publish_major=false
          publish_minor=false
          if [[ "$version" != dev && "$version" != *-* ]]; then
            latest=true
            publish_major=true
            publish_minor=true
            IFS=. read -r major minor patch <<< "${version#v}"
            while IFS= read -r tag; do
              [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
              [[ "$tag" == "$version" ]] && break
              latest=false
              if [[ "$tag" == "v$major."* ]]; then publish_major=false; fi
              if [[ "$tag" == "v$major.$minor."* ]]; then publish_minor=false; fi
            done < <(git tag --list 'v*' --sort=-version:refname)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "major=$publish_major" >> "$GITHUB_OUTPUT"
          echo "minor=$publish_minor" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: github.ref_type == 'tag'
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push architecture image by digest
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=campfire-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=campfire-${{ matrix.arch }}
      - name: Export image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${IMAGE_DIGEST#sha256:}"
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || exit 1
          touch "$RUNNER_TEMP/digests/$digest"
      - uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
      - name: Export static binaries for tagged release
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: binaries
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
          outputs: type=local,dest=dist/binaries
          cache-from: type=gha,scope=campfire-${{ matrix.arch }}
      - name: Archive binaries and installation files
        if: github.ref_type == 'tag'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: node scripts/package-release.mjs "$RELEASE_VERSION" "$RELEASE_ARCH" dist/binaries
      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: campfire-linux-${{ matrix.arch }}
          path: |
            dist/releases/*.tar.gz
            dist/releases/*.sha256
          if-no-files-found: error

  publish-manifest:
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-*
          merge-multiple: true
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ${{ needs.prepare.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.latest == 'true' }}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ needs.prepare.outputs.minor == 'true' }}
            type=semver,pattern=v{{major}},enable=${{ needs.prepare.outputs.major == 'true' }}
      - name: Publish multi-platform image tags
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        shell: bash
        run: |
          images=()
          for entry in "$RUNNER_TEMP"/digests/*; do
            digest="${entry##*/}"
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || exit 1
            images+=("$IMAGE@sha256:$digest")
          done
          [[ ${#images[@]} -eq 2 ]] || exit 1
          tags=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then tags+=(--tag "$tag"); fi
          done <<< "$IMAGE_TAGS"
          [[ ${#tags[@]} -gt 0 ]] || exit 1
          docker buildx imagetools create "${tags[@]}" "${images[@]}"

  release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs: [prepare, package, publish-manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist/releases
          pattern: campfire-linux-*
          merge-multiple: true
      - uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --current --strip header
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          body: ${{ steps.cliff.outputs.content }}
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          make_latest: ${{ needs.prepare.outputs.latest }}
          fail_on_unmatched_files: true
          files: |
            dist/releases/*.tar.gz
            dist/releases/*.sha256
