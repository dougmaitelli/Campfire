name: Documentation

on:
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy documentation from master after validation
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: make dependencies-docs
      - run: make docs-check
      - run: make docs-build
      - uses: actions/configure-pages@v6
        if: inputs.deploy && github.ref == 'refs/heads/master'
      - uses: actions/upload-pages-artifact@v5
        if: inputs.deploy && github.ref == 'refs/heads/master'
        with:
          path: docs/dist

  deploy:
    needs: build
    if: inputs.deploy && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
